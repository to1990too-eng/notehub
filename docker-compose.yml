services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notehub
      POSTGRES_PASSWORD: notehub
      POSTGRES_DB: notehub
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notehub"]
      interval: 5s
      retries: 5

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://notehub:notehub@db:5432/notehub
    depends_on:
      db:
        condition: service_healthy
    ports: ["8000:8000"]
    volumes: ["./app:/app/app"]
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  pgdata: